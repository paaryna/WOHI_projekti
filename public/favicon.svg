<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">Ivory chess pawn</title>
  <desc id="desc">A glossy ivory chess pawn with dark outlines on a transparent background.</desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".42" stop-color="#f2dfc2"/>
      <stop offset=".76" stop-color="#c9b69e"/>
      <stop offset="1" stop-color="#8f806f"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".5" stop-color="#ead8bd"/>
      <stop offset="1" stop-color="#a89782"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".55" stop-color="#f0dfc5"/>
      <stop offset="1" stop-color="#b5a28d"/>
    </linearGradient>
    <radialGradient id="head" cx=".32" cy=".2" r=".85">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset=".56" stop-color="#f1dfc6"/>
      <stop offset="1" stop-color="#a99883"/>
    </radialGradient>
  </defs>

  <!-- Head -->
  <circle cx="256" cy="150" r="112" fill="url(#head)" stroke="#292521" stroke-width="9"/>
  <ellipse cx="215" cy="91" rx="43" ry="22" transform="rotate(-28 215 91)" fill="#fffefa" opacity=".9"/>
  <ellipse cx="184" cy="126" rx="9" ry="6" transform="rotate(-28 184 126)" fill="#fffefa" opacity=".8"/>
  <path d="M160 205c35 39 116 51 174 13" fill="none" stroke="#fff8e9" stroke-width="8" opacity=".45" stroke-linecap="round"/>

  <!-- Neck collar -->
  <path d="M188 247c0-17 30-25 68-25s68 8 68 25c0 13-30 23-68 23s-68-10-68-23Z"
        fill="url(#ivory)" stroke="#292521" stroke-width="8"/>
  <path d="M202 246c19 9 89 9 108 0" fill="none" stroke="#fffdf5" stroke-width="7" stroke-linecap="round"/>

  <!-- Shoulder ring -->
  <path d="M143 267c-29 6-42 20-42 39 0 23 43 34 155 34s155-11 155-34c0-19-13-33-42-39"
        fill="url(#base)" stroke="#292521" stroke-width="9" stroke-linejoin="round"/>
  <path d="M123 298c31 16 235 16 266 0" fill="none" stroke="#fffdf5" stroke-width="8" stroke-linecap="round" opacity=".85"/>

  <!-- Tapered body -->
  <path d="M174 329c-2 88-26 168-65 226 27 25 267 25 294 0-39-58-63-138-65-226Z"
        fill="url(#stem)" stroke="#292521" stroke-width="10" stroke-linejoin="round"/>
  <path d="M194 365c-5 65-21 125-47 172" fill="none" stroke="#fffefa" stroke-width="13" stroke-linecap="round" opacity=".85"/>
  <path d="M310 366c9 73 27 128 48 167" fill="none" stroke="#9e8d79" stroke-width="10" stroke-linecap="round" opacity=".35"/>

  <!-- Lower plinth -->
  <path d="M108 546c-32 7-49 23-49 43 0 26 79 38 197 38s197-12 197-38c0-20-17-36-49-43"
        fill="url(#base)" stroke="#292521" stroke-width="10" stroke-linejoin="round"/>
  <path d="M78 585c41 20 315 20 356 0" fill="none" stroke="#fffdf5" stroke-width="9" stroke-linecap="round" opacity=".85"/>
  <path d="M61 589c-16 16-13 37 4 47 39 23 343 23 382 0 17-10 20-31 4-47"
        fill="url(#ivory)" stroke="#292521" stroke-width="10" stroke-linejoin="round"/>
  <path d="M83 622c46 17 300 17 346 0" fill="none" stroke="#fffdf5" stroke-width="8" stroke-linecap="round" opacity=".7"/>
</svg>